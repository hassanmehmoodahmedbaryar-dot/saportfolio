<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="50%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,.16)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,.06)"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="thumb1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="thumb2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="thumb3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="120" cy="80" r="180" fill="#22d3ee" opacity=".2"/>
  <circle cx="700" cy="430" r="200" fill="#0ea5e9" opacity=".25"/>

  <!-- Header -->
  <text x="40" y="58" fill="#fff" font-family="Inter, sans-serif" font-size="26" font-weight="900">Video Rewards</text>
  <text x="40" y="82" fill="rgba(255,255,255,.7)" font-family="Inter, sans-serif" font-size="12" font-weight="500" letter-spacing="2">WATCH · EARN · REDEEM</text>

  <!-- Coins balance pill (top right) -->
  <g transform="translate(620, 36)">
    <rect width="140" height="44" rx="22" fill="rgba(255,255,255,.95)"/>
    <circle cx="22" cy="22" r="13" fill="url(#gold)"/>
    <text x="22" y="27" text-anchor="middle" fill="#78350f" font-family="Inter, sans-serif" font-size="13" font-weight="900">$</text>
    <text x="44" y="20" fill="#0c4a6e" font-family="Inter, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">BALANCE</text>
    <text x="44" y="36" fill="#0c4a6e" font-family="Inter, sans-serif" font-size="14" font-weight="800">1,247 pts</text>
  </g>

  <!-- Featured video player -->
  <g transform="translate(40, 110)">
    <rect width="446" height="240" rx="20" fill="url(#thumb1)"/>
    <!-- mock thumbnail content -->
    <rect width="446" height="240" rx="20" fill="rgba(0,0,0,.25)"/>
    <!-- Play button -->
    <circle cx="223" cy="120" r="42" fill="url(#play)"/>
    <path d="M 213 100 L 213 140 L 245 120 Z" fill="#fff"/>
    <!-- progress + meta -->
    <rect x="20" y="184" width="406" height="6" rx="3" fill="rgba(255,255,255,.25)"/>
    <rect x="20" y="184" width="142" height="6" rx="3" fill="#fde047"/>
    <text x="20" y="212" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="700">How startups scale to 1M users</text>
    <text x="20" y="228" fill="rgba(255,255,255,.7)" font-family="Inter, sans-serif" font-size="11">12:48 · earn 25 pts</text>
    <!-- earn pill -->
    <g transform="translate(346, 196)">
      <rect width="80" height="28" rx="14" fill="url(#gold)"/>
      <circle cx="14" cy="14" r="7" fill="#fff" opacity=".5"/>
      <text x="50" y="19" text-anchor="middle" fill="#78350f" font-family="Inter, sans-serif" font-size="12" font-weight="800">+25 pts</text>
    </g>
  </g>

  <!-- Right column: redeem -->
  <g transform="translate(502, 110)">
    <rect width="258" height="240" rx="20" fill="url(#card)" stroke="rgba(255,255,255,.15)"/>
    <text x="20" y="34" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="1">DAILY STREAK</text>
    <text x="20" y="62" fill="#fff" font-family="Inter, sans-serif" font-size="32" font-weight="900">14<tspan font-size="16" font-weight="700" fill="rgba(255,255,255,.7)"> days</tspan></text>
    <!-- Streak dots -->
    <g transform="translate(20, 78)">
      <circle cx="12" cy="12" r="10" fill="#fde047"/>
      <text x="12" y="16" text-anchor="middle" fill="#78350f" font-family="Inter, sans-serif" font-size="10" font-weight="800">M</text>
      <circle cx="42" cy="12" r="10" fill="#fde047"/>
      <text x="42" y="16" text-anchor="middle" fill="#78350f" font-family="Inter, sans-serif" font-size="10" font-weight="800">T</text>
      <circle cx="72" cy="12" r="10" fill="#fde047"/>
      <text x="72" y="16" text-anchor="middle" fill="#78350f" font-family="Inter, sans-serif" font-size="10" font-weight="800">W</text>
      <circle cx="102" cy="12" r="10" fill="#fde047"/>
      <text x="102" y="16" text-anchor="middle" fill="#78350f" font-family="Inter, sans-serif" font-size="10" font-weight="800">T</text>
      <circle cx="132" cy="12" r="10" fill="#fde047"/>
      <text x="132" y="16" text-anchor="middle" fill="#78350f" font-family="Inter, sans-serif" font-size="10" font-weight="800">F</text>
      <circle cx="162" cy="12" r="10" fill="rgba(255,255,255,.2)"/>
      <text x="162" y="16" text-anchor="middle" fill="rgba(255,255,255,.6)" font-family="Inter, sans-serif" font-size="10" font-weight="800">S</text>
      <circle cx="192" cy="12" r="10" fill="rgba(255,255,255,.2)"/>
      <text x="192" y="16" text-anchor="middle" fill="rgba(255,255,255,.6)" font-family="Inter, sans-serif" font-size="10" font-weight="800">S</text>
    </g>

    <!-- Cashout -->
    <rect x="20" y="120" width="218" height="100" rx="16" fill="rgba(0,0,0,.18)"/>
    <text x="36" y="148" fill="rgba(255,255,255,.7)" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">REDEEM</text>
    <text x="36" y="172" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="700">$25 Amazon Gift Card</text>
    <text x="36" y="188" fill="rgba(255,255,255,.6)" font-family="Inter, sans-serif" font-size="11">2,500 pts · ~1 week away</text>
    <rect x="36" y="194" width="186" height="8" rx="4" fill="rgba(255,255,255,.2)"/>
    <rect x="36" y="194" width="92" height="8" rx="4" fill="url(#gold)"/>
  </g>

  <!-- Bottom rail -->
  <text x="40" y="378" fill="rgba(255,255,255,.7)" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="2">UP NEXT</text>
  <g transform="translate(40, 392)">
    <rect width="220" height="84" rx="14" fill="url(#thumb2)"/>
    <circle cx="40" cy="42" r="16" fill="rgba(255,255,255,.85)"/>
    <path d="M 36 34 L 36 50 L 50 42 Z" fill="#9a3412"/>
    <text x="68" y="40" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="700">Cooking 101</text>
    <text x="68" y="58" fill="rgba(255,255,255,.85)" font-family="Inter, sans-serif" font-size="10">8 min · earn 15 pts</text>
    <rect x="148" y="60" width="60" height="18" rx="9" fill="url(#gold)"/>
    <text x="178" y="73" text-anchor="middle" fill="#78350f" font-family="Inter, sans-serif" font-size="10" font-weight="800">+15 pts</text>
  </g>
  <g transform="translate(290, 392)">
    <rect width="220" height="84" rx="14" fill="url(#thumb3)"/>
    <circle cx="40" cy="42" r="16" fill="rgba(255,255,255,.85)"/>
    <path d="M 36 34 L 36 50 L 50 42 Z" fill="#064e3b"/>
    <text x="68" y="40" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="700">Travel: Tokyo</text>
    <text x="68" y="58" fill="rgba(255,255,255,.85)" font-family="Inter, sans-serif" font-size="10">14 min · earn 30 pts</text>
    <rect x="148" y="60" width="60" height="18" rx="9" fill="url(#gold)"/>
    <text x="178" y="73" text-anchor="middle" fill="#78350f" font-family="Inter, sans-serif" font-size="10" font-weight="800">+30 pts</text>
  </g>
  <g transform="translate(540, 392)">
    <rect width="220" height="84" rx="14" fill="url(#thumb1)"/>
    <circle cx="40" cy="42" r="16" fill="rgba(255,255,255,.85)"/>
    <path d="M 36 34 L 36 50 L 50 42 Z" fill="#581c87"/>
    <text x="68" y="40" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="700">Tech reviews</text>
    <text x="68" y="58" fill="rgba(255,255,255,.85)" font-family="Inter, sans-serif" font-size="10">10 min · earn 20 pts</text>
    <rect x="148" y="60" width="60" height="18" rx="9" fill="url(#gold)"/>
    <text x="178" y="73" text-anchor="middle" fill="#78350f" font-family="Inter, sans-serif" font-size="10" font-weight="800">+20 pts</text>
  </g>
</svg>
